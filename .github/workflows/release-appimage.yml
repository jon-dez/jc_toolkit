name: Release AppImage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Build AppImage
        run: |
          docker compose -f packaging/docker-compose.appimage.yml run --rm --build jctoolkit-appimage

      - name: Create draft release and upload AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APPIMAGE="${{ github.workspace }}/dist/JCToolKit-x86_64.AppImage"
          test -f "$APPIMAGE" || { echo "AppImage not found at $APPIMAGE"; ls -la dist/ 2>/dev/null || true; exit 1; }
          gh release create "${{ github.event.inputs.tag }}" --draft --title "${{ github.event.inputs.tag }}" || true
          gh release upload "${{ github.event.inputs.tag }}" "$APPIMAGE" --clobber
